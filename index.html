<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kamelikortti – QR stickers</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐫</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root { --sand:#EDE3CF; --card:#FBF8F2; --ink:#2B2620; --muted:#6E6250; --btn:#3F5B4A; --line:#D9CDB4; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--sand); color:var(--ink); font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { margin: 6px 0 4px; font-size: 1.7rem; }
  .meta { color: var(--muted); margin: 0 0 16px; }
  a { color: var(--btn); }
  .panel { background: var(--card); border:1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  label { font-size: .9rem; color: var(--muted); }
  input, select { font: inherit; padding: 9px 10px; border:1px solid var(--line); border-radius: 10px; background:#fff; color:var(--ink); }
  input[type=number] { width: 84px; }
  button { font: inherit; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--btn); background: #fff; color: var(--btn); cursor: pointer; }
  button.primary { background: var(--btn); color: #fff; }
  .list { display:grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 6px; margin-top: 10px; }
  .list label { display:flex; gap:8px; align-items:center; color: var(--ink); font-size: 1rem; padding: 6px 4px; }
  .msg { padding: 14px; border-radius: 12px; background: #F3E2DC; color:#7A2E1F; }

  /* stickers */
  .sheet { display:grid; gap: 6mm; grid-template-columns: repeat(var(--cols,3), 1fr); }
  .sticker { background:#fff; border: 1px dashed #b9ad95; border-radius: 3mm; padding: 4mm; text-align:center; break-inside: avoid; page-break-inside: avoid; }
  .sticker svg { width: 100%; height: auto; display:block; margin: 0 auto 2mm; }
  .sticker .name { font-weight: 700; font-size: var(--fs,13pt); line-height:1.15; word-break: break-word; }
  .sticker .code { font-family: ui-monospace, Menlo, monospace; font-size: calc(var(--fs,13pt) * .8); color:#333; margin-top: 1mm; }
  .sticker .hint { font-size: calc(var(--fs,13pt) * .6); color:#666; margin-top: 1mm; }

  @media print {
    @page { size: A4; margin: 10mm; }
    body { background:#fff; }
    .noprint { display:none !important; }
    .wrap { padding:0; max-width:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="noprint">
    <a href="/">← Kamelikortti</a>
    <h1>QR stickers</h1>
    <p class="meta">Each sticker opens the camel's page, just like the NFC tag. Pick camels, choose a size and press Print.</p>
    <div id="status"></div>

    <div class="panel" id="pickPanel" style="display:none">
      <div class="row" style="justify-content:space-between">
        <strong>Camels</strong>
        <div class="row">
          <button type="button" id="allBtn">Select all</button>
          <button type="button" id="noneBtn">Select none</button>
        </div>
      </div>
      <div class="list" id="camelList"></div>
    </div>

    <div class="panel">
      <strong>Extra codes for new tags</strong>
      <p class="meta" style="margin:6px 0 10px">Makes stickers for camels not added yet, e.g. camel005 – camel020. Scanning one opens the New camel form.</p>
      <div class="row">
        <label>Prefix <input id="prefix" value="camel" style="width:110px"></label>
        <label>From <input id="from" type="number" min="0" value="1"></label>
        <label>To <input id="to" type="number" min="0" value="0"></label>
        <label>Digits <input id="digits" type="number" min="1" max="6" value="3"></label>
      </div>
    </div>

    <div class="panel row">
      <label>Size
        <select id="size">
          <option value="4">Small – 4 per row</option>
          <option value="3"
