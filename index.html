<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kamelikortti</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐫</text></svg>">
<style>
  :root{
    --sand:#ECE3D0; --ink:#33291F; --oasis:#2C6B66; --oasis-dark:#1F4E4A;
    --card:#FBF8F1; --line:#e3d9c3; --muted:#7a6d59;
    --ultra:#6B4E8E; --injection:#A8483F; --embryo:#B98A2E; --other:#3E6E9E; --photo:#4E7D4E;
    --warn:#a8483f;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --sand:#221D16; --ink:#EDE6D6; --card:#2B241A; --line:#463C2C; --muted:#b6a98f;
    }
  }
  :root[data-theme="dark"]{
    --sand:#221D16; --ink:#EDE6D6; --card:#2B241A; --line:#463C2C; --muted:#b6a98f;
  }
  *{box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    max-width:560px;margin:0 auto;padding:16px 14px 70px;
    background:var(--sand);color:var(--ink);line-height:1.45;
  }
  h1{font-size:1.4rem;margin:6px 0 2px}
  h2{font-size:1.05rem;margin:22px 0 8px;color:var(--oasis-dark)}
  p.meta{color:var(--muted);margin:0 0 10px;font-size:.92rem}
  a{color:var(--oasis-dark)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
  .grid-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
  .big-btn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 8px;
    text-decoration:none;color:var(--ink);font-size:.86rem;text-align:center;font-weight:600;
    min-height:76px;cursor:pointer;
  }
  .big-btn .ic{font-size:1.6rem}
  .big-btn.ultra{border-color:var(--ultra)}
  .big-btn.injection{border-color:var(--injection)}
  .big-btn.embryo{border-color:var(--embryo)}
  .big-btn.other{border-color:var(--other)}
  .big-btn.photo{border-color:var(--photo)}
  .big-btn.wide{grid-column:1 / -1;flex-direction:row;min-height:56px}
  a.button, button.primary{
    display:inline-block;background:var(--oasis);color:white;border:none;
    padding:11px 18px;border-radius:8px;text-decoration:none;font-size:.95rem;cursor:pointer;
  }
  a.button:hover, button.primary:hover{background:var(--oasis-dark)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer;font-size:.9rem}
  button.danger{background:transparent;color:var(--warn);border:1px solid var(--warn);padding:6px 10px;border-radius:6px;font-size:.82rem;cursor:pointer}
  button.mic{background:var(--card);border:1px solid var(--oasis);color:var(--oasis-dark);border-radius:20px;padding:8px 14px;font-size:.85rem;cursor:pointer}
  button.mic.rec{background:var(--warn);color:white;border-color:var(--warn)}
  label{display:block;font-size:.83rem;color:var(--muted);margin-top:12px}
  input,textarea,select{
    width:100%;padding:9px;margin-top:4px;border-radius:6px;border:1px solid var(--line);
    font-size:1rem;background:var(--card);color:var(--ink);
  }
  textarea{min-height:70px}
  .field.suggested input, .field.suggested textarea, .field.suggested select{border-color:var(--embryo);box-shadow:0 0 0 2px rgba(185,138,46,.15)}
  .row-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .flash{background:#f6dcd8;border:1px solid var(--warn);color:#6e2a22;padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:.88rem}
  .flash.ok{background:#dcefe0;border-color:var(--oasis);color:#1c4a3f}
  .record{border-left:4px solid var(--other);padding-left:12px;margin-bottom:12px}
  .record.cat-ultrasound{border-color:var(--ultra)}
  .record.cat-injection{border-color:var(--injection)}
  .record.cat-embryo{border-color:var(--embryo)}
  .record.cat-pregnancycheck{border-color:var(--embryo)}
  .record.cat-photo{border-color:var(--photo)}
  .record .label{font-weight:700;display:block;margin-bottom:4px}
  .record.cat-flush{border-color:var(--embryo)}
  .record.cat-breeding{border-color:#8a5a2b}
  .record.cat-task{border-color:var(--oasis)}
  .big-btn.breeding{border-color:#8a5a2b}
  .breeding-card{border-left:4px solid #8a5a2b}
  .record .row-actions{align-items:center}
  .big-btn.flush{border-color:var(--embryo)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
  .stat .n{font-size:1.45rem;font-weight:700;color:var(--oasis-dark);display:block;line-height:1.2}
  .stat .t{font-size:.74rem;color:var(--muted)}
  .stat.hl{border-color:var(--embryo);border-width:2px}
  .stat.hl .n{color:var(--embryo)}
  .tbl-wrap{overflow-x:auto}
  table.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
  table.tbl th,table.tbl td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  table.tbl th:first-child,table.tbl td:first-child{text-align:left}
  table.tbl th{color:var(--muted);font-weight:600}
  .st-preg{color:var(--oasis-dark);font-weight:700}
  .st-open{color:var(--warn);font-weight:700}
  .st-pend{color:var(--muted)}
  .record small{color:var(--muted);display:block;margin-top:4px}
  .record .kv{margin:2px 0;font-size:.92rem}
  .record .kv b{color:var(--muted);font-weight:600}
  .backlink{display:inline-block;margin-bottom:10px;font-size:.9rem}
  .top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .top-nav .icon-link{font-size:1.3rem;text-decoration:none}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .filters button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:5px 12px;font-size:.8rem;cursor:pointer}
  .filters button.active{background:var(--oasis);color:white;border-color:var(--oasis)}
  .due-item{display:flex;justify-content:space-between;align-items:center}
  .due-item.overdue{color:var(--warn);font-weight:600}
  .photo-thumb{max-width:100%;border-radius:8px;margin-top:8px;display:block}
  .empty{color:var(--muted);font-size:.92rem}
  .hint{font-size:.8rem;color:var(--muted);margin-top:6px}
  .med-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
  .med-grid2{margin-top:8px;max-width:220px}
  .stock-box{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:.9rem;line-height:1.45}
  .stock-box.low{border-color:var(--warn);background:#f8e3df}
  .stock-alert{border-color:var(--warn);background:#f8e3df}
  .primary-link{background:var(--oasis);color:#fff;text-decoration:none;padding:8px 14px;border-radius:10px;font-weight:600;font-size:.9rem}
  .job-day{font-size:1rem;margin:18px 0 8px;color:var(--muted)}
  .job-day.today-h{color:var(--oasis)}
  .job-day.overdue-h{color:var(--warn)}
  .job{padding:12px 14px}
  .job-main{display:flex;gap:10px;align-items:flex-start}
  .job-ic{font-size:1.4rem;line-height:1.2}
  .job-body{flex:1;min-width:0}
  .job-time{display:inline-block;background:var(--sand);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-variant-numeric:tabular-nums;margin-right:2px}
  .job-detail{font-size:.92rem;margin-top:3px}
  .job-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .btn-small{font:inherit;font-size:.82rem;padding:6px 11px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .btn-small.primary{background:var(--oasis);border-color:var(--oasis);color:#fff}
  .btn-small.danger{color:var(--warn);border-color:var(--warn);background:transparent}
  .job.overdue{border-color:var(--warn)}
  .job.done{opacity:.6}
  .job.done strong{text-decoration:line-through}
  .jobs-banner{display:block;text-decoration:none;color:inherit;border-color:var(--oasis)}
  .jobs-banner.has-overdue{border-color:var(--warn)}
  .jobs-banner .arrow{float:right;font-size:1.2rem;line-height:1}
  .warn-txt{color:var(--warn);font-weight:600}
  .job-mini{display:block;text-decoration:none;color:inherit;font-size:.92rem;padding:10px 12px}
  .job-mini .job-when{float:right;color:var(--muted);font-size:.85rem}
  .job-mini.overdue{border-color:var(--warn)}
  .badge{display:inline-block;background:var(--line);color:var(--ink);border-radius:10px;padding:2px 8px;font-size:.75rem;margin-left:6px}
  #notify{position:fixed;left:0;right:0;top:0;z-index:1000;display:none;padding:10px 14px;font-size:.9rem;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  #notify.show{display:block}
  #notify.err{background:#f6dcd8;color:#6e2a22;border-bottom:1px solid var(--warn)}
  #notify.ok{background:#dcefe0;color:#1c4a3f;border-bottom:1px solid var(--oasis)}
</style>
</head>
<body>
<div id="notify"></div>
<div id="whoami" style="font-size:.78rem;color:var(--muted);text-align:right;margin-bottom:6px"></div>
<div id="app">Loading…</div>

<script>
(function(){
"use strict";

// ---------- schema ----------
var CATEGORY_LABEL = {
  ultrasound: "Ultrasound examination",
  injection: "Injection / medication",
  breeding: "Breeding / mating",
  embryo: "Embryo transfer",
  pregnancycheck: "Pregnancy check",
  flush: "Flush / OPU",
  other: "Other note",
  task: "Planned job",
  photo: "Photo"
};
var CATEGORY_ICON = {
  ultrasound: "🩻", injection: "💉", breeding: "🐪", embryo: "🧬",
  pregnancycheck: "🤰", flush: "🥚", other: "📋", task: "📅", photo: "📷"
};

var FIELD_SCHEMAS = {
  ultrasound: [
    {key:"datetime", label:"Date and time", type:"datetime-local", required:true},
    {key:"vet", label:"Veterinary surgeon", type:"text", default:"Pentti"},
    {key:"leftOvary", label:"Left ovary", type:"text"},
    {key:"rightOvary", label:"Right ovary", type:"text"},
    {key:"uterusFindings", label:"Uterine findings", type:"text"},
    {key:"uterusFluid", label:"Uterine fluid", type:"text"},
    {key:"pregnancyAge", label:"Pregnancy age", type:"text"},
    {key:"fetalFindings", label:"Fetal findings", type:"text"},
    {key:"statement", label:"Free-text statement", type:"textarea", voice:true},
    {key:"nextExamDate", label:"Next exam date", type:"date", due:"Next ultrasound"}
  ],
  injection: [
    {key:"datetime", label:"Time given", type:"datetime-local", required:true},
    {key:"drug", label:"Drug", type:"select", options:["GnRH","hCG","Progesterone","Prostaglandin (PGF2α)","Oxytocin","Antibiotic","Anti-inflammatory","Other"]},
    {key:"dose", label:"Dose", type:"number", decimal:true},
    {key:"route", label:"Route", type:"select", options:["IM (intramuscular)","IV (intravenous)","SC (subcutaneous)","IU (intrauterine)","Other"]},
    {key:"administrator", label:"Given by", type:"text"},
    {key:"nextDose", label:"Next dose", type:"datetime-local", due:"drug"},
    {key:"adverseEffect", label:"Possible adverse effect", type:"textarea", voice:true}
  ],
  breeding: [
    {key:"datetime", label:"Date and time of breeding", type:"datetime-local", required:true},
    {key:"male", label:"Male used", type:"text", required:true},
    {key:"method", label:"Method", type:"select", options:["Natural mating","Hand mating","Artificial insemination","Other"]},
    {key:"bredBy", label:"Done by", type:"text"},
    {key:"notes", label:"Notes", type:"textarea", voice:true},
    {key:"nextCheckDate", label:"Next check (e.g. ovulation or pregnancy)", type:"date", due:"Check after breeding"}
  ],
  embryo: [
    {key:"date", label:"Date", type:"date", required:true},
    {key:"donor", label:"Donor", type:"text"},
    {key:"recipient", label:"Recipient", type:"text"},
    {key:"hormoneTreatment", label:"Hormone treatments", type:"text"},
    {key:"ovulationTime", label:"Ovulation time", type:"datetime-local"},
    {key:"flushDay", label:"Flush day", type:"date"},
    {key:"embryoCount", label:"Number of embryos", type:"text"},
    {key:"embryoGrading", label:"Embryo grading", type:"text"},
    {key:"embryoType", label:"Type", type:"select", options:["Fresh","Frozen","Vitrified"]},
    {key:"transferDate", label:"Transfer date", type:"date"},
    {key:"transferredBy", label:"Transferred by", type:"text"},
    {key:"recipientCL", label:"Recipient's CL", type:"text"},
    {key:"nextCheckDate", label:"Next pregnancy check", type:"date", due:"Next pregnancy check"},
    {key:"outcome", label:"Outcome", type:"textarea", voice:true}
  ],
  pregnancycheck: [
    {key:"date", label:"Date", type:"date", required:true},
    {key:"vet", label:"Veterinarian", type:"text"},
    {key:"result", label:"Result", type:"select", options:["Pregnant","Not pregnant","Uncertain"]},
    {key:"age", label:"Pregnancy age", type:"text"},
    {key:"notes", label:"Notes", type:"textarea", voice:true},
    {key:"nextCheckDate", label:"Next check", type:"date", due:"Next pregnancy check"}
  ],
  flush: [
    {key:"date", label:"Date", type:"date", required:true},
    {key:"vet", label:"Veterinarian", type:"text"},
    {key:"procedure", label:"Procedure", type:"select", options:["Flush","OPU","IVF"]},
    {key:"embryosRecovered", label:"Embryos recovered", type:"number"},
    {key:"unfertilized", label:"Unfertilized oocytes", type:"number"},
    {key:"degenerated", label:"Degenerated embryos", type:"number"},
    {key:"transferredFresh", label:"Transferred fresh", type:"number"},
    {key:"frozen", label:"Frozen / vitrified", type:"number"},
    {key:"recipients", label:"Recipients", type:"text"},
    {key:"notes", label:"Notes", type:"textarea", voice:true}
  ],
  other: [
    {key:"date", label:"Date", type:"date", required:true},
    {key:"subtype", label:"Type", type:"select", options:["Blood test / lab result","Vaccination","Diagnosis","Treatment plan","Competition / training","Other"]},
    {key:"value", label:"Result / description", type:"text"},
    {key:"notes", label:"Additional notes", type:"textarea", voice:true}
  ],
  task: [
    {key:"jobTypeLabel", label:"Job", type:"text"},
    {key:"date", label:"Date", type:"date"},
    {key:"time", label:"Time", type:"text"},
    {key:"drug", label:"Medication", type:"text"},
    {key:"dose", label:"Dose", type:"text"},
    {key:"doneAt", label:"Done", type:"text"},
    {key:"notes", label:"Notes", type:"textarea"}
  ]
};

var PROFILE_FIELDS = [
  {key:"name", label:"Name", type:"text", required:true},
  {key:"owner", label:"Owner", type:"text"},
  {key:"sex", label:"Sex", type:"select", options:["Male","Female"]},
  {key:"birthdate", label:"Date of birth", type:"date"},
  {key:"microchip", label:"Official microchip number", type:"text"},
  {key:"nfcTag", label:"NFC tag ID", type:"text"},
  {key:"stall", label:"Barn", type:"text"},
  {key:"pen", label:"Stall / pen", type:"text"},
  {key:"camelType", label:"Type", type:"select", options:["Donor","Recipient","Racing camel","Other"]}
];

// ---------- state ----------
var db = null, sample = null, assets = null, userCap = null;
var app = document.getElementById("app");
var canWrite = true; // resolved from user capability when available

// ---------- helpers ----------
function h(str){ var d=document.createElement("div"); d.textContent=str==null?"":String(str); return d.innerHTML; }
function fmtDate(iso){ if(!iso) return ""; try{ var d=new Date(iso); return d.toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"}); }catch(e){return iso;} }
function fmtDateTime(iso){ if(!iso) return ""; try{ var d=new Date(iso); return d.toLocaleDateString("en-GB")+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }catch(e){return iso;} }
function cleanTag(t){ return String(t||"").trim().replace(/\s+/g,"").replace(/[^A-Za-z0-9_\-.~:@+]/g,""); }
function nowIso(){ return new Date().toISOString(); }
function go(hash){ window.location.hash = hash; }
function esc(s){ return h(s); }
var notifyTimer = null;
function notify(msg, isErr){
  var el = document.getElementById("notify");
  if(!el) return;
  el.textContent = msg + "  ";
  var closeBtn = document.createElement("button");
  closeBtn.textContent = "✕";
  closeBtn.style.cssText = "background:none;border:none;font-size:1rem;cursor:pointer;color:inherit;margin-left:8px";
  closeBtn.addEventListener("click", function(){ el.classList.remove("show"); });
  el.appendChild(closeBtn);
  el.className = "show " + (isErr ? "err" : "ok");
  if(notifyTimer) clearTimeout(notifyTimer);
  notifyTimer = setTimeout(function(){ el.classList.remove("show"); }, 7000);
  el.scrollIntoView({behavior:"smooth", block:"start"});
}

function flashHtml(msg, ok){
  return '<div class="flash '+(ok?"ok":"")+'">'+esc(msg)+'</div>';
}

// ---------- server API (Vercel + Supabase) ----------
var pinShown = false;
async function api(action, payload){
  var r = await fetch("/api/app", {
    method:"POST", credentials:"same-origin",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(Object.assign({action:action}, payload||{}))
  });
  if(r.status === 401){ showPin(); throw new Error("PIN required"); }
  var j = {};
  try{ j = await r.json(); }catch(e){}
  if(!r.ok) throw new Error(j.error || ("Server error " + r.status));
  return j.result;
}

function showPin(msg){
  pinShown = true;
  var whoami = document.getElementById("whoami");
  if(whoami) whoami.textContent = "";
  app.innerHTML = '<div class="card" style="margin-top:40px;text-align:center">'
    + '<div style="font-size:3rem">🐫</div><h1>Kamelikortti</h1>'
    + '<p class="meta">Enter the PIN to open camel records.</p>'
    + '<input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" style="text-align:center;font-size:1.4rem;letter-spacing:.2em">'
    + '<div id="pinErr" style="color:var(--warn);min-height:1.4em;margin-top:8px">' + esc(msg||"") + '</div>'
    + '<button class="primary" id="pinGo" style="width:100%;margin-top:6px">Open</button></div>';
  var input = document.getElementById("pinInput");
  var goBtn = document.getElementById("pinGo");
  async function tryPin(){
    var pin = input.value.trim();
    if(!pin){ input.focus(); return; }
    goBtn.disabled = true; goBtn.textContent = "Checking…";
    try{
      var r = await fetch("/api/app", {method:"POST", credentials:"same-origin",
        headers:{"Content-Type":"application/json"}, body: JSON.stringify({action:"login", pin:pin})});
      if(r.ok){ pinShown = false; setWho(); render(); return; }
      var j = {}; try{ j = await r.json(); }catch(e){}
      showPin(j.error || "Wrong PIN.");
    }catch(e){
      showPin("No connection. Check the network and try again.");
    }
  }
  goBtn.addEventListener("click", tryPin);
  input.addEventListener("keydown", function(ev){ if(ev.key === "Enter") tryPin(); });
  setTimeout(function(){ input.focus(); }, 50);
}

function setWho(){
  var whoami = document.getElementById("whoami");
  if(whoami) whoami.innerHTML = 'Unlocked · <a href="#" id="lockBtn">Lock</a>';
  var lb = document.getElementById("lockBtn");
  if(lb) lb.addEventListener("click", async function(ev){
    ev.preventDefault();
    try{ await fetch("/api/app", {method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body: JSON.stringify({action:"logout"})}); }catch(e){}
    showPin();
  });
}

function fileToUpload(file){
  return new Promise(function(resolve, reject){
    if(!/^image\//.test(file.type || "")){
      if(file.size > 3*1024*1024){ reject(new Error("The file is too large (max 3 MB for videos). Use a photo or a shorter clip.")); return; }
      var fr = new FileReader();
      fr.onload = function(){ resolve({contentType: file.type || "application/octet-stream", base64: String(fr.result).split(",")[1], ext: (file.name.split(".").pop() || "bin").toLowerCase()}); };
      fr.onerror = function(){ reject(new Error("Could not read the file.")); };
      fr.readAsDataURL(file);
      return;
    }
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      var max = 1600, w = img.naturalWidth, ht = img.naturalHeight;
      var sc = Math.min(1, max / Math.max(w, ht));
      var c = document.createElement("canvas");
      c.width = Math.round(w*sc); c.height = Math.round(ht*sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({contentType:"image/jpeg", base64: c.toDataURL("image/jpeg", 0.82).split(",")[1], ext:"jpg"});
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("Could not read the image.")); };
    img.src = url;
  });
}

async function initCaps(){
  db = {};
  sample = { json: function(prompt){ return api("ai", {prompt: prompt}); } };
  assets = { upload: async function(file){ var f = await fileToUpload(file); return api("upload", f); } };
}

// ---------- data access ----------
async function getCamel(tag){ return api("getCamel", {tag: tag}); }
async function listCamels(){
  var list = await api("listCamels");
  return (list || []).filter(function(c){ return c && c.tag && String(c.tag).charAt(0) !== "_"; });
}

// ---------- medications & prices ----------
var MEDS_TAG = "_medications";
var CURRENCY = "AED";
var MED_UNITS = ["ml","IU","mg","tablet","dose"];
var DEFAULT_MED_NAMES = ["GnRH","hCG","Progesterone","Prostaglandin (PGF2α)","Oxytocin","Antibiotic","Anti-inflammatory",
  "Folltropin (FSH)","Stimufol (FSH)","Novormon (PMSG)","Fertiline"];
var medsCache = null;
async function getMeds(force){
  if(medsCache && !force) return medsCache;
  var d = null;
  try{ d = await getCamel(MEDS_TAG); }catch(e){}
  if(d && Array.isArray(d.meds) && d.meds.length) medsCache = d.meds;

function medUnitPrice(m){

function money(n){

function medCostTotals(records){

  records.forEach(function(r){
    if(r.category !== "injection") return;

  });

// ---------- medication stock ----------
// med.stock = {countDate, countBottles, adds:[{date, bottles}]}
function stockStart(meds){
  var start = null;
  meds.forEach(function(m){ if(m.stock && m.stock.countDate && (!start || m.stock.countDate < start)) start = m.stock.countDate; });
  return start;
}
async function loadInjectionsSince(since){
  if(!since) return [];
  return (await api("listByCategory", {cat: "injection", since: since})) || [];
}
function stockStatus(m, injections){
  if(!m || !m.stock || !m.stock.countDate) return null;
  var size = parseFloat(m.size);
  var st = m.stock;
  var added = 0;
  (st.adds || []).forEach(function(a){ if(a.date >= st.countDate) added += parseFloat(a.bottles) || 0; });
  var used = 0, doses = 0;
  injections.forEach(function(r){
    var d = r.data || {};
    if(d.drug !== m.name) return;
    if(!r.createdAt || r.createdAt < st.countDate) return;
    if(d.doseUnit && d.doseUnit !== m.unit) return;
    var amt = parseFloat(d.dose);
    if(amt > 0){ used += amt; doses++; }
  });
  var startBottles = (parseFloat(st.countBottles) || 0) + added;
  var res = {countDate: st.countDate, countBottles: parseFloat(st.countBottles) || 0, added: added, used: used, doses: doses, hasSize: size > 0};
  if(size > 0){
    res.usedBottles = used / size;
    res.leftBottles = startBottles - used / size;
    res.leftAmount = startBottles * size - used;
  }
  var min = parseFloat(m.minBottles);
  res.min = isNaN(min) ? 1 : min;
  res.low = res.hasSize && res.leftBottles < res.min;
  return res;
}
function fmtNum(n, dec){
  return (Number(n) || 0).toLocaleString("en-US", {maximumFractionDigits: dec == null ? 1 : dec});
}
async function lowStockList(){
  var meds = await getMeds(true);

  var inj = await loadInjectionsSince(since);

  meds.forEach(function(m){ var st = stockStatus(m, inj); if(st && st.low) out.push({name: m.name, left: st.leftBottles}); });
  return out;
}

// ---------- computing due info from a field schema ----------
function computeDue(category, values){
  var schema = FIELD_SCHEMAS[category] || [];
  for(var i=0;i<schema.length;i++){
    var f = schema[i];
    if(f.due && values[f.key]){
      var label;
      if(f.due === "drug"){ label = "Next dose" + (values.drug ? ": "+values.drug : ""); }
      else { label = f.due; }
      var dueDate = values[f.key];
      // normalize date-only to ISO
      if(dueDate.length === 10) dueDate = dueDate + "T00:00:00";
      return { dueDate: new Date(dueDate).toISOString(), dueLabel: label };
    }
  }
  return null;
}

// ---------- rendering: forms ----------
function renderField(f, value){
  var id = "f_"+f.key;
  var req = f.required ? "required" : "";
  var val = (value==null || value==="") ? (f.default || "") : value;
  var out = '<div class="field" data-key="'+f.key+'"><label for="'+id+'">'+esc(f.label)+'</label>';
  if(f.type === "select"){
    out += '<select id="'+id+'" '+req+'><option value="">—</option>';
    f.options.forEach(function(opt){
      out += '<option value="'+esc(opt)+'"'+(val===opt?" selected":"")+'>'+esc(opt)+'</option>';
    });
    out += '</select>';
  } else if(f.type === "textarea"){
    out += '<textarea id="'+id+'" '+req+'>'+esc(val)+'</textarea>';
    if(f.voice){
      out += '<div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap">'
           + '<button type="button" class="mic" id="mic_'+f.key+'">🎤 Dictate</button>'
           + '<button type="button" class="ghost" id="suggest_'+f.key+'">✨ Suggest fields from speech</button>'
           + '</div><div class="hint" id="michint_'+f.key+'"></div>';
    }
  } else {
    var extraAttr = f.type === "number" ? (f.decimal ? ' inputmode="decimal" min="0" step="any"' : ' inputmode="numeric" min="0" step="1"') : '';
    out += '<input id="'+id+'" type="'+f.type+'" value="'+esc(val)+'"'+extraAttr+' '+req+'>';
  }
  out += '</div>';
  return out;
}

function renderForm(schema, values){
  values = values || {};
  return schema.map(function(f){ return renderField(f, values[f.key]); }).join("");
}

function collectForm(schema){
  var out = {};
  schema.forEach(function(f){
    var el = document.getElementById("f_"+f.key);
    if(el) out[f.key] = el.value.trim();
  });
  return out;
}

function markSuggested(schema, keys){
  keys.forEach(function(k){
    var wrap = document.querySelector('.field[data-key="'+k+'"]');
    if(wrap) wrap.classList.add("suggested");
  });
}

// ---------- speech recognition ----------
var recognition = null;
function startDictation(targetTextareaId, btn, hintEl){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    hintEl.textContent = "Speech recognition isn't supported in this browser. You can still type the text manually.";
    return;
  }
  if(recognition){ try{ recognition.stop(); }catch(e){} recognition=null; btn.classList.remove("rec"); btn.textContent="🎤 Dictate"; return; }
  recognition = new SR();
  recognition.lang = "en-US";
  recognition.continuous = true;
  recognition.interimResults = true;
  var ta = document.getElementById(targetTextareaId);
  var base = ta.value ? ta.value + " " : "";
  btn.classList.add("rec"); btn.textContent = "⏹ Stop";
  hintEl.textContent = "Listening…";
  recognition.onresult = function(ev){
    var interim = "", final = "";
    for(var i=ev.resultIndex;i<ev.results.length;i++){
      var t = ev.results[i][0].transcript;
      if(ev.results[i].isFinal) final += t; else interim += t;
    }
    if(final) base += final + " ";
    ta.value = base + interim;
  };
  recognition.onerror = function(ev){
    hintEl.textContent = "Speech recognition stopped (" + ev.error + "). You can keep typing.";
    btn.classList.remove("rec"); btn.textContent="🎤 Dictate"; recognition=null;
  };
  recognition.onend = function(){
    btn.classList.remove("rec"); btn.textContent="🎤 Dictate";
    hintEl.textContent = "";
    recognition = null;
  };
  try{ recognition.start(); }catch(e){ hintEl.textContent="Couldn't start the microphone."; }
}

async function suggestFromTranscript(category, transcript, schema, freeTextKey){
  if(!sample){
    notify("AI suggestions aren't available in this view.", true);
    return;
  }
  if(!transcript || transcript.trim().length < 3){
    notify("Dictate or type a description first.", true);
    return;
  }
  var otherFields = schema.filter(function(f){ return f.key !== freeTextKey; });
  var fieldDesc = otherFields.map(function(f){
    var opts = f.options ? (" (one of: " + f.options.join(", ") + ")") : "";
    return '"'+f.key+'": '+f.label+opts;
  }).join("; ");
  var prompt = "You are a veterinary assistant for camel medical records (" + CATEGORY_LABEL[category] + "). "
    + "The veterinarian dictated this note: \"" + transcript.replace(/"/g,"'") + "\". "
    + "Extract values for these fields, if mentioned in the text (omit fields that aren't mentioned): "
    + fieldDesc + ". "
    + "Reply with ONLY a JSON object whose keys are the field names above and whose values are short strings. Do not add any other keys.";
  try{
    var data = await sample.json(prompt, {modelTier:"quick"});
    var filled = [];
    Object.keys(data||{}).forEach(function(k){
      var el = document.getElementById("f_"+k);
      if(el && data[k]){
        el.value = data[k];
        filled.push(k);
      }
    });
    markSuggested(schema, filled);
    if(filled.length === 0){
      notify("The AI couldn't find any fields to fill from that text. Fill in the rest manually.", true);
    }
  }catch(e){
    var msg = "The suggestion failed.";
    if(e && e.code === "not_granted") msg = "AI use wasn't allowed for this page.";
    else if(e && e.code === "rate_limited") msg = "Too many requests right now — try again shortly.";
    notify(msg, true);
  }
}

function wireVoiceButtons(schema){

// ---------- export ----------
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  var urls = [
    "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
  ];
  return new Promise(function(resolve, reject){
    function tryNext(i){
      if(i >= urls.length){ reject(new Error("Could not load the Excel tool. Check the internet connection.")); return; }
      var sc = document.createElement("script");
      sc.src = urls[i];
      sc.onload = function(){ window.XLSX ? resolve(window.XLSX) : tryNext(i+1); };
      sc.onerror = function(){ tryNext(i+1); };
      document.head.appendChild(sc);
    }
    tryNext(0);
  });
}
function exportCell(v){
  if(v == null) return "";
  if(typeof v === "object") return JSON.stringify(v);
  return v;
}
async function exportAll(btn){

    }); });

      ));
    });

    // Records, grouped by category
    var byCat = {}, total = 0;

      btn.textContent = "Reading " + (i+1) + " / " + camels.length + "…";

      recs.forEach(function(r){
        var cat = r.category || "other";

        total++;
      });
    }

    var wb = XLSX.utils.book_new();
    var ws = XLSX.utils.aoa_to_sheet(camelRows);
    ws["!cols"] = camelHead.map(function(){ return {wch: 18}; });

    var order = Object.keys(CATEGORY_LABEL).concat(Object.keys(byCat).filter(function(k){ return !CATEGORY_LABEL[k]; }));
    var usedNames = {Camels: true};
    order.forEach(function(cat){
      var list = byCat[cat];
      if(!list || !list.length) return;
      var schema = FIELD_SCHEMAS[cat] || [];
      var keys = schema.map(function(f){ return f.key; });
      var heads = schema.map(function(f){ return f.label; });
      list.forEach(function(r){ Object.keys(r.data || {}).forEach(function(k){
        var nice = {assetId:"Photo link", caption:"Caption", cost:"Cost ("+CURRENCY+")", doseUnit:"Dose unit", currency:"Currency", unitPrice:"Price per unit ("+CURRENCY+")"};
        if(keys.indexOf(k) < 0){ keys.push(k); heads.push(nice[k] || k); }
      }); });
      var head = ["Camel tag", "Camel name"].concat(heads, ["Next due", "Due date", "Saved"]);
      var rows = [head];
      list.sort(function(a,b){ return String(a.createdAt||"").localeCompare(String(b.createdAt||"")); });
      list.forEach(function(r){
        var d = r.data || {};
        rows.push([r.camelTag, names[r.camelTag] || ""].concat(
          keys.map(function(k){ return (k === "assetId" && d[k]) ? photoBase + d[k] : exportCell(d[k]); }),
          [exportCell(r.dueLabel), exportCell(r.dueDate), exportCell(r.createdAt)]
        ));
      });
      var sname = String(CATEGORY_LABEL[cat] || cat).replace(/[\\\/\?\*\[\]:]/g, "-").slice(0, 31);
      while(usedNames[sname]) sname = sname.slice(0, 28) + "_" + Math.floor(Math.random()*90+10);
      usedNames[sname] = true;
      var wsr = XLSX.utils.aoa_to_sheet(rows);
      wsr["!cols"] = head.map(function(){ return {wch: 18}; });
      XLSX.utils.book_append_sheet(wb, wsr, sname);
    });

    var costRows = [["Camel tag","Camel name","Priced doses","Doses without price","Medication cost ("+CURRENCY+")"]];
    var perCamel = {};
    (byCat.injection || []).forEach(function(r){ (perCamel[r.camelTag] = perCamel[r.camelTag] || []).push(r); });
    camels.forEach(function(cm){
      var t = medCostTotals(perCamel[cm.tag] || []);
      if(t.priced || t.unpriced) costRows.push([cm.tag, cm.name || "", t.priced, t.unpriced, Math.round(t.total*100)/100]);
    });
    if(costRows.length > 1){
      var wsc = XLSX.utils.aoa_to_sheet(costRows);
      wsc["!cols"] = costRows[0].map(function(){ return {wch: 20}; });
      XLSX.utils.book_append_sheet(wb, wsc, "Medication cost per camel");
    }
    try{
      var medList = await getMeds(true);
      var stockInj = [];
      try{ stockInj = await loadInjectionsSince(stockStart(medList)); }catch(e){}
      var medRows = [["Medication","Bottle price ("+CURRENCY+")","Bottle size","Unit","Price per unit ("+CURRENCY+")","Stock counted on","Bottles counted","Bottles added since","Used since count","Bottles in stock now"]];
      medList.forEach(function(m){
        var up = medUnitPrice(m); var st = stockStatus(m, stockInj);
        medRows.push([m.name, m.price, m.size, m.unit, up===null ? "" : Math.round(up*10000)/10000,
          st ? st.countDate : "", st ? st.countBottles : "", st ? st.added : "", st ? Math.round(st.used*100)/100 : "",
          (st && st.hasSize) ? Math.round(st.leftBottles*100)/100 : ""]);
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(medRows), "Medication prices");
    }catch(e){}

    var today = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, "Kamelikortti-backup-" + today + ".xlsx");
    notify("Export ready: " + camels.length + " camels, " + total + " records.");
  } catch(e){
    notify("Export failed: " + (e && e.message ? e.message : e), true);
  } finally {
    btn.disabled = false; btn.textContent = oldText;
  }
}

function recordSummaryLine(r){
  var schema = FIELD_SCHEMAS[r.category] || [];
  var parts = [];
  schema.forEach(function(f){
    if(f.type==="textarea") return;
    var v = r.data[f.key];
    if(v && (r.category === "injection" || r.category === "task") && f.key === "dose" && r.data.doseUnit) v = v + " " + r.data.doseUnit;
    if(v && f.key === "doneAt") v = "✓ " + fmtDateTime(v);
    else if(v && f.type === "datetime-local" && /^\d{4}-\d{2}-\d{2}T/.test(v)) v = fmtDateTime(v);
    else if(v && f.type === "date" && /^\d{4}-\d{2}-\d{2}$/.test(v)) v = fmtDate(v + "T12:00:00");
    if(v) parts.push('<span class="kv"><b>'+esc(f.label)+':</b> '+esc(v)+'</span>');
  });
  if(r.category === "injection" && r.data.cost != null && r.data.cost !== ""){
    parts.push('<span class="kv"><b>Cost:</b> '+esc(money(r.data.cost))+'</span>');
  }
  var free = schema.filter(function(f){return f.type==="textarea";});
  var freeHtml = "";
  free.forEach(function(f){
    if(r.data[f.key]) freeHtml += '<p class="kv">'+esc(r.data[f.key])+'</p>';
  });
  return parts.join(" &nbsp;·&nbsp; ") + freeHtml;
}

async function listByCategory(cat){ return api("listByCategory", {cat: cat}); }
function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function tagFromText(t){ var m = /\(([^)]+)\)\s*$/.exec(t||""); return m ? m[1].trim() : null; }
function dayOf(v){ return v ? String(v).slice(0,10) : ""; }
function pct(a,b){ return b ? Math.round(a*100/b) + " %" : "–"; }

var PERIODS = [
  {key:"all", label:"All time"},
  {key:"12m", label:"Last 12 months"},
  {key:"year", label:"This year"},
  {key:"90d", label:"Last 90 days"}
];
function periodStart(key){
  var d = new Date();
  if(key === "12m"){ d.setFullYear(d.getFullYear()-1); return d.toISOString().slice(0,10); }
  if(key === "90d"){ d.setDate(d.getDate()-90); return d.toISOString().slice(0,10); }
  if(key === "year"){ return d.getFullYear() + "-01-01"; }
  return "";
}

async function viewEmbryoDashboard(period){
  period = period || "all";
  var res = await Promise.all([listByCategory("flush"), listByCategory("embryo"), listByCategory("pregnancycheck"), listCamels()]);
  var flushes = res[0], transfers = res[1], checks = res[2], camels = res[3];
  var nameOf = {};
  camels.forEach(function(c){ nameOf[c.tag] = c.name || c.tag; });
  var from = periodStart(period);
  var inRange = function(d){ return !from || (d && d >= from); };

  flushes = flushes.filter(function(r){ return inRange(dayOf(r.data.date)); })
    .sort(function(a,b){ return dayOf(b.data.date).localeCompare(dayOf(a.data.date)); });
  transfers = transfers.map(function(r){
    var d = dayOf(r.data.transferDate || r.data.date);
    var rec = tagFromText(r.data.recipient) || r.camelTag;
    return {r:r, date:d, recipient:rec};
  }).filter(function(t){ return inRange(t.date); })
    .sort(function(a,b){ return b.date.localeCompare(a.date); });

  // totals
  var T = {flush:0, opu:0, ivf:0, rec:0, unf:0, deg:0, fresh:0, frozen:0};
  var donors = {};
  flushes.forEach(function(r){
    var d = r.data, p = (d.procedure||"Flush");
    if(p === "OPU") T.opu++; else if(p === "IVF") T.ivf++; else T.flush++;
    T.rec += num(d.embryosRecovered); T.unf += num(d.unfertilized); T.deg += num(d.degenerated);
    T.fresh += num(d.transferredFresh); T.frozen += num(d.frozen);
    var k = r.camelTag;
    if(!donors[k]) donors[k] = {n:0, rec:0, fresh:0, frozen:0};
    donors[k].n++; donors[k].rec += num(d.embryosRecovered);
    donors[k].fresh += num(d.transferredFresh); donors[k].frozen += num(d.frozen);
  });

  // pregnancy outcome per transfer: latest check on the recipient on/after transfer date
  var preg = 0, open = 0, pend = 0;
  transfers.forEach(function(t){
    var later = checks.filter(function(c){
      return c.camelTag === t.recipient && dayOf(c.data.date) >= t.date;
    }).sort(function(a,b){ return dayOf(b.data.date).localeCompare(dayOf(a.data.date)); });
    var res = later.length ? later[0].data.result : "";
    if(res === "Pregnant"){ t.status = "Pregnant"; preg++; }
    else if(res === "Not pregnant"){ t.status = "Not pregnant"; open++; }
    else { t.status = later.length ? "Uncertain" : "Awaiting check"; pend++; }
    t.checkDate = later.length ? dayOf(later[0].data.date) : "";
  });

  var totalFlushes = flushes.length;
  var html = '<a class="backlink" href="#/">← Camels</a><h1>🧬 Embryo program</h1>';
  html += '<div class="filters">';
  PERIODS.forEach(function(p){
    html += '<button data-p="'+p.key+'" class="'+(period===p.key?'active':'')+'">'+p.label+'</button>';
  });
  html += '</div>';

  html += '<div class="stats">'
    + stat(totalFlushes, "Flushes / OPU")

    + stat(totalFlushes ? (T.rec/totalFlushes).toFixed(1) : "–", "Embryos per flush")
    + stat(T.fresh, "Transferred fresh")
    + stat(T.frozen, "Frozen / vitrified")
    + stat(T.unf, "Unfertilized oocytes")
    + stat(T.deg, "Degenerated")
    + stat(T.opu, "OPU")
    + stat(T.ivf, "IVF")

  html += '<h2>Pregnancy rate</h2><div class="stats">'

    + transfers.length + ' transfer' + (transfers.length===1?'':'s') + ' in this period.</p>';

    });
    html += '</tbody></table></div>';
  }

  // per flush
  html += '<h2>Flushes</h2>';

    html += '<p class="empty">No flushes in this period.</p>';
  } else {
    flushes.forEach(function(r){
      var d = r.data;
      html += '<div class="card record cat-flush"><span class="label">🥚 '+esc(d.procedure||"Flush")+' · <a href="#/k/'+encodeURIComponent(r.camelTag)+'">'+esc(nameOf[r.camelTag]||r.camelTag)+'</a></span>'
        + '<div class="kv"><b>'+fmtDate(d.date)+'</b>'+(d.vet?' &nbsp;'+esc(d.vet):'')+'</div>'
        + '<div class="kv">Recovered <b>'+num(d.embryosRecovered)+'</b> &nbsp; Fresh <b>'+num(d.transferredFresh)+'</b> &nbsp; Frozen <b>'+num(d.frozen)+'</b> &nbsp; UFO <b>'+num(d.unfertilized)+'</b> &nbsp; Degen. <b>'+num(d.degenerated)+'</b></div>'
        + (d.recipients ? '<div class="kv">Recipients: '+esc(d.recipients)+'</div>' : '')
        + '</div>';
    });
  }

  // transfers
  html += '<h2>Transfers and results</h2>';
  if(!transfers.length){
    html += '<p class="empty">No embryo transfers in this period.</p>';
  } else {
    html += '<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Recipient</th><th>Transfer</th><th>Donor</th><th>Result</th></tr></thead><tbody>';
    transfers.forEach(function(t){
      var cls = t.status === "Pregnant" ? "st-preg" : (t.status === "Not pregnant" ? "st-open" : "st-pend");
      var donorTag = tagFromText(t.r.data.donor);
      var donorTxt = donorTag ? (nameOf[donorTag]||donorTag) : (t.r.data.donor||"");
      html += '<tr><td><a href="#/k/'+encodeURIComponent(t.recipient)+'">'+esc(nameOf[t.recipient]||t.recipient)+'</a></td>'
        + '<td>'+fmtDate(t.date)+'</td><td>'+esc(donorTxt)+'</td>'
        + '<td class="'+cls+'">'+esc(t.status)+(t.checkDate?'<br><small style="font-weight:400;color:var(--muted)">'+fmtDate(t.checkDate)+'</small>':'')+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }

  app.innerHTML = html;
  document.querySelectorAll(".filters button").forEach(function(b){
    b.addEventListener("click", function(){ go("#/embryo/"+b.getAttribute("data-p")); });

function stat(n, t, hl){

async function viewMeds(){
  var meds = (await getMeds(true)).map(function(m){ return Object.assign({unit:"ml"}, m); });
  var injections = [];
  try{ injections = await loadInjectionsSince(stockStart(meds)); }catch(e){}
  function today(){ return nowIso(); }
  function stockHtml(m){
    var st = stockStatus(m, injections);
    if(!st) return '<div class="stock-box"><b>Stock:</b> not set yet. Tap <i>Count stock</i> and enter how many bottles you have now.</div>';
    var h = '<div class="stock-box'+(st.low?' low':'')+'">';
    if(st.hasSize){
      h += '<b>'+(st.low?'⚠️ ':'')+'In stock: '+fmtNum(st.leftBottles,2)+' bottles</b> ('+fmtNum(st.leftAmount,1)+' '+esc(m.unit)+')';
      h += '<br>Used: '+fmtNum(st.used,1)+' '+esc(m.unit)+' = '+fmtNum(st.usedBottles,2)+' bottles ('+st.doses+' dose'+(st.doses===1?'':'s')+')';
    } else {
      h += '<b>Bottles counted: '+fmtNum(st.countBottles + st.added,2)+'</b><br>Enter the bottle size to see how much is left. Used: '+fmtNum(st.used,1)+' '+esc(m.unit);
    }
    h += '<br><small>Since count on '+esc(fmtDateTime(st.countDate))+': '+fmtNum(st.countBottles,2)+' bottles'
      + (st.added ? ' + '+fmtNum(st.added,2)+' added' : '') + '</small></div>';
    return h;
  }
  function rowHtml(m, i){
    var up = medUnitPrice(m);
    var unitOpts = MED_UNITS.map(function(u){ return '<option'+(u===m.unit?' selected':'')+'>'+u+'</option>'; }).join("");
    return '<div class="card med-row" data-i="'+i+'">'
      + '<label>Medication name</label><input class="m-name" value="'+esc(m.name||"")+'">'
      + '<div class="med-grid">'
      + '<div><label>Bottle price ('+CURRENCY+')</label><input class="m-price" type="number" inputmode="decimal" min="0" step="any" value="'+esc(m.price||"")+'"></div>'
      + '<div><label>Bottle size</label><input class="m-size" type="number" inputmode="decimal" min="0" step="any" value="'+esc(m.size||"")+'"></div>'
      + '<div><label>Unit</label><select class="m-unit">'+unitOpts+'</select></div>'
      + '</div>'
      + '<div class="hint m-up">'+(up!==null ? 'Price per '+esc(m.unit)+': '+esc(money(up)) : 'Enter bottle price and size to calculate dose costs.')+'</div>'
      + stockHtml(m)
      + '<div class="med-grid2"><div><label>Warn when below (bottles)</label><input class="m-min" type="number" inputmode="decimal" min="0" step="any" value="'+esc(m.minBottles==null?"1":m.minBottles)+'"></div></div>'
      + '<div class="row-actions" style="flex-wrap:wrap">'
      + '<button type="button" class="primary m-add">+ Add bottles</button>'
      + '<button type="button" class="ghost m-count">Count stock</button>'
      + '<button type="button" class="danger m-del">Remove</button></div>'
      + '<div class="m-inline"></div>'
      + '</div>';
  }
  function readRow(row, i){
    meds[i] = Object.assign({}, meds[i], {
      name: row.querySelector(".m-name").value.trim(), price: row.querySelector(".m-price").value.trim(),
      size: row.querySelector(".m-size").value.trim(), unit: row.querySelector(".m-unit").value,
      minBottles: row.querySelector(".m-min").value.trim()
    });
  }
  function validate(list){
    var seen = {};
    for(var k=0;k<list.length;k++){
      var key = list[k].name.toLowerCase();
      if(seen[key]){ notify('"'+list[k].name+'" is listed twice.', true); return false; }
      seen[key] = true;
    }
    return true;
  }
  async function persist(msg){
    document.querySelectorAll(".med-row").forEach(function(row){ readRow(row, +row.getAttribute("data-i")); });
    var clean = meds.filter(function(m){ return m.name; });
    if(!validate(clean)) return false;
    try{
      await saveMeds(clean); meds = clean.slice();
      try{ injections = await loadInjectionsSince(stockStart(meds)); }catch(e){}
      draw(); notify(msg || "Medications saved.", false); return true;
    }catch(e){ notify("Couldn't save: " + (e && e.message ? e.message : e), true); return false; }
  }
  function inlineAsk(row, title, placeholder, onOk){
    var box = row.querySelector(".m-inline");
    box.innerHTML = '<div class="field" style="margin-top:10px"><label>'+esc(title)+'</label>'
      + '<input class="m-q" type="number" inputmode="decimal" min="0" step="any" placeholder="'+esc(placeholder)+'"></div>'
      + '<div class="row-actions"><button type="button" class="primary m-ok">OK</button><button type="button" class="ghost m-cancel">Cancel</button></div>';
    var inp = box.querySelector(".m-q"); inp.focus();
    box.querySelector(".m-cancel").addEventListener("click", function(){ box.innerHTML = ""; });
    box.querySelector(".m-ok").addEventListener("click", function(){
      var v = parseFloat(inp.value);
      if(isNaN(v) || v < 0){ notify("Enter a number of bottles.", true); return; }
      onOk(v);
    });
  }
  function draw(){
    var low = [];
    meds.forEach(function(m){ var st = stockStatus(m, injections); if(st && st.low) low.push(m.name + " (" + fmtNum(st.leftBottles,2) + ")"); });
    var html = '<a class="backlink" href="#/">← Camels</a><h1>💊 Medications</h1>'
      + '<p class="meta">Enter the price and size of one bottle. The app works out the cost of every dose and how much stock is left. Prices in '+CURRENCY+'.</p>';
    if(low.length) html += '<div class="card stock-alert">⚠️ <b>Low stock:</b> '+low.map(esc).join(", ")+'</div>';
    html += meds.map(rowHtml).join("");
    html += '<div class="row-actions"><button type="button" class="ghost" id="medAdd">+ Add medication</button>'
      + '<button type="button" class="primary" id="medSave">Save</button></div>'
      + '<p class="hint">Stock goes down automatically each time an injection of that medication is saved. <b>Add bottles</b> when you buy more. <b>Count stock</b> sets the exact number of bottles you have now (use it if the numbers drift). Changing a price affects new doses only.</p>';
    app.innerHTML = html;
    document.querySelectorAll(".med-row").forEach(function(row){
      var i = +row.getAttribute("data-i");
      function sync(){
        readRow(row, i);
        var up = medUnitPrice(meds[i]);
        row.querySelector(".m-up").textContent = up !== null ? "Price per " + meds[i].unit + ": " + money(up) : "Enter bottle price and size to calculate dose costs.";
      }
      row.querySelectorAll(".m-name,.m-price,.m-size,.m-unit,.m-min").forEach(function(el){ el.addEventListener("input", sync); el.addEventListener("change", sync); });
      row.querySelector(".m-del").addEventListener("click", function(){
        document.querySelectorAll(".med-row").forEach(function(r2){ readRow(r2, +r2.getAttribute("data-i")); });
        meds.splice(i,1); draw(); notify("Removed. Tap Save to keep the change.", false);
      });
      row.querySelector(".m-add").addEventListener("click", function(){
        readRow(row, i);
        if(!meds[i].name){ notify("Enter the medication name first.", true); return; }
        inlineAsk(row, "How many bottles did you add?", "e.g. 5", async function(v){
          var m = meds[i];
          if(!m.stock || !m.stock.countDate){ m.stock = {countDate: today(), countBottles: v, adds: []}; }
          else { m.stock = Object.assign({}, m.stock, {adds: (m.stock.adds || []).concat([{date: today(), bottles: v}])}); }
          await persist(fmtNum(v,2) + " bottle" + (v===1?"":"s") + " of " + m.name + " added.");
        });
      });
      row.querySelector(".m-count").addEventListener("click", function(){
        readRow(row, i);
        if(!meds[i].name){ notify("Enter the medication name first.", true); return; }
        inlineAsk(row, "How many bottles do you have right now? (e.g. 2.5 for two and a half)", "e.g. 3", async function(v){
          var m = meds[i];
          m.stock = {countDate: today(), countBottles: v, adds: []};
          await persist("Stock of " + m.name + " set to " + fmtNum(v,2) + " bottles.");
        });
      });
    });
    document.getElementById("medAdd").addEventListener("click", function(){
      document.querySelectorAll(".med-row").forEach(function(row){ readRow(row, +row.getAttribute("data-i")); });
      meds.push({name:"", price:"", size:"", unit:"ml", minBottles:"1"}); draw();
      var rows = document.querySelectorAll(".med-row"); var last = rows[rows.length-1];
      if(last){ last.scrollIntoView({behavior:"smooth"}); last.querySelector(".m-name").focus(); }
    });
    document.getElementById("medSave").addEventListener("click", function(){ persist(); });
  }
  draw();
}

// ---------- jobs (planned + automatic due dates) ----------
var JOB_TYPES = [
  {key:"medication", label:"Medication", icon:"💉", form:"injection"},
  {key:"breeding",   label:"Breeding / mating", icon:"🐪", form:"breeding"},
  {key:"flush",      label:"Embryo flush", icon:"🥚", form:"flush"},
  {key:"opu",        label:"OPU", icon:"🔬", form:"flush"},
  {key:"transfer",   label:"Embryo transfer", icon:"🧬", form:"embryo"},
  {key:"ultrasound", label:"Ultrasound", icon:"🩻", form:"ultrasound"},
  {key:"pregcheck",  label:"Pregnancy check", icon:"🤰", form:"pregnancycheck"},
  {key:"other",      label:"Other job", icon:"📋", form:"other"}
];
function jobType(key){ for(var i=0;i<JOB_TYPES.length;i++) if(JOB_TYPES[i].key===key) return JOB_TYPES[i]; return JOB_TYPES[JOB_TYPES.length-1]; }
var hashQuery = new URLSearchParams("");
function pad2(n){ return (n<10?"0":"")+n; }
function ymdLocal(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function hmLocal(d){ return pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function localNowInput(){ var d = new Date(); return ymdLocal(d)+"T"+hmLocal(d); }
function jobInfo(r){
  var d = r.data || {};
  var due = r.dueDate ? new Date(r.dueDate) : null;
  var info = {r: r, due: due, day: due ? ymdLocal(due) : "", done: !!d.doneAt, camelTag: r.camelTag, id: r._id};
  if(r.category === "task"){
    var t = jobType(d.jobType);
    info.type = t.key; info.icon = t.icon;
    info.title = t.label + (d.drug ? ": " + d.drug : "");
    var bits = [];
    if(d.dose) bits.push(d.dose + (d.doseUnit ? " " + d.doseUnit : ""));
    if(d.seriesCount > 1) bits.push("(" + d.seriesIndex + " of " + d.seriesCount + ")");
    info.detail = bits.join(" ");
    info.notes = d.notes || "";
    info.allDay = !d.time;
    info.drug = d.drug || ""; info.dose = d.dose || "";
  } else {
    var map = {injection:"medication", ultrasound:"ultrasound", embryo:"pregcheck", pregnancycheck:"pregcheck", breeding:"pregcheck"};
    var t2 = jobType(map[r.category] || "other");
    info.type = t2.key; info.icon = t2.icon;
    info.title = r.dueLabel || "Reminder";
    info.detail = (r.category === "injection" && d.dose) ? "Last dose: " + d.dose + (d.doseUnit ? " " + d.doseUnit : "") : "";
    info.notes = "";
    info.allDay = !due || (due.getHours() === 0 && due.getMinutes() === 0);
    info.drug = r.category === "injection" ? (d.drug || "") : ""; info.dose = r.category === "injection" ? (d.dose || "") : "";
  }
  return info;
}
function dayHeading(day, today){
  var t = new Date(today + "T00:00"); var d = new Date(day + "T00:00");
  var diff = Math.round((d - t) / 86400000);
  var label = d.toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long"});
  if(diff === 0) return "Today · " + label;
  if(diff === 1) return "Tomorrow · " + label;
  return label;
}
async function loadJobs(){
  var from = new Date(); from.setDate(from.getDate() - 30);
  var list = await listDue(ymdLocal(from));
  return (list || []).filter(function(r){ return r.camelTag && String(r.camelTag).charAt(0) !== "_"; }).map(jobInfo)
    .sort(function(a,b){ return (a.due ? a.due.getTime() : 0) - (b.due ? b.due.getTime() : 0); });
}
function jobsTodayCount(jobs){
  var today = ymdLocal(new Date()); var n = 0, over = 0;
  jobs.forEach(function(j){ if(j.done) return; if(j.day === today) n++; else if(j.day < today) over++; });
  return {today: n, overdue: over};
}

async function viewJobs(filter, showDone){
  filter = filter || "all";
  var jobs = await loadJobs();
  var camels = await listCamels();
  var names = {}; camels.forEach(function(c){ names[c.tag] = c.name || c.tag; });
  var today = ymdLocal(new Date());
  var shown = jobs.filter(function(j){ return filter === "all" || j.type === filter; });
  var doneCount = shown.filter(function(j){ return j.done; }).length;
  if(!showDone) shown = shown.filter(function(j){ return !j.done; });
  // past jobs that are done are only shown when "show done" is on; past undone = overdue
  var html = '<a class="backlink" href="#/">← Camels</a>'
    + '<div class="top-nav"><h1>📅 Jobs</h1><a class="primary-link" href="#/jobs/new">+ Plan job</a></div>';
  html += '<div class="filters">';
  html += '<button data-f="all" class="'+(filter==="all"?'active':'')+'">All</button>';
  JOB_TYPES.forEach(function(t){ html += '<button data-f="'+t.key+'" class="'+(filter===t.key?'active':'')+'">'+t.icon+' '+esc(t.label)+'</button>'; });
  html += '</div>';
  if(doneCount) html += '<p class="hint" style="margin-top:-4px"><a href="#/jobs/'+filter+(showDone?'':'?done=1')+'">'+(showDone?'Hide':'Show')+' '+doneCount+' done job'+(doneCount===1?'':'s')+'</a></p>';
  var overdue = shown.filter(function(j){ return j.day < today && !j.done; });
  var rest = shown.filter(function(j){ return !(j.day < today && !j.done) && (j.day >= today || showDone); });
  function item(j){
    var t = jobType(j.type);
    var camelName = names[j.camelTag] || j.camelTag;
    var timeTxt = j.allDay ? "" : hmLocal(j.due);
    var h = '<div class="card job'+(j.done?' done':'')+(j.day < today && !j.done?' overdue':'')+'">'
      + '<div class="job-main"><span class="job-ic">'+j.icon+'</span><div class="job-body">'
      + '<strong>'+(timeTxt ? '<span class="job-time">'+timeTxt+'</span> ' : '')+esc(j.title)+'</strong>'
      + '<div class="meta" style="margin:2px 0 0"><a href="#/k/'+encodeURIComponent(j.camelTag)+'">'+esc(camelName)+'</a> · '+esc(j.camelTag)
      + (j.day < today ? ' · ' + esc(fmtDate(j.due)) : '') + '</div>'
      + (j.detail ? '<div class="job-detail">'+esc(j.detail)+'</div>' : '')
      + (j.notes ? '<div class="hint">'+esc(j.notes)+'</div>' : '')
      + (j.done ? '<div class="hint">✓ Done '+esc(fmtDateTime(j.r.data.doneAt))+'</div>' : '')
      + '</div></div><div class="job-actions">';
    if(!j.done && t.form){
      var q = "?job=" + encodeURIComponent(j.id);
      if(j.type === "medication"){ if(j.drug) q += "&drug=" + encodeURIComponent(j.drug); if(j.dose) q += "&dose=" + encodeURIComponent(j.dose); }
      h += '<a class="btn-small primary" href="#/k/'+encodeURIComponent(j.camelTag)+'/f/'+t.form+q+'">'+(j.type==="medication"?'💉 Give now':'📝 Record')+'</a>';
    }
    h += '<button type="button" class="btn-small ghost j-done" data-id="'+esc(j.id)+'" data-done="'+(j.done?'0':'1')+'">'+(j.done?'↩︎ Undo':'✓ Done')+'</button>';
    if(j.r.category === "task") h += '<button type="button" class="btn-small danger j-del" data-id="'+esc(j.id)+'">Delete</button>';
    h += '</div></div>';
    return h;
  }
  if(!overdue.length && !rest.length){
    html += '<p class="empty">No jobs planned'+(filter!=="all" ? ' for '+esc(jobType(filter).label) : '')+'. Tap <b>+ Plan job</b> to add one.</p>';
  }
  if(overdue.length){
    html += '<h2 class="job-day overdue-h">⚠️ Overdue ('+overdue.length+')</h2>' + overdue.map(item).join("");
  }
  var lastDay = null;
  rest.forEach(function(j){
    if(j.day !== lastDay){ html += '<h2 class="job-day'+(j.day===today?' today-h':'')+'">'+esc(dayHeading(j.day, today))+'</h2>'; lastDay = j.day; }
    html += item(j);
  });
  app.innerHTML = html;
  document.querySelectorAll(".filters button").forEach(function(b){
    b.addEventListener("click", function(){ go("#/jobs/" + b.getAttribute("data-f") + (showDone ? "?done=1" : "")); });
  });
  document.querySelectorAll(".j-done").forEach(function(b){
    b.addEventListener("click", async function(){
      b.disabled = true;
      try{ await setDone(b.getAttribute("data-id"), b.getAttribute("data-done") === "1"); notify(b.getAttribute("data-done") === "1" ? "Marked as done." : "Marked as not done.", false); await viewJobs(filter, showDone); }
      catch(e){ b.disabled = false; notify("Couldn't update: " + (e && e.message ? e.message : e), true); }
    });
  });
  document.querySelectorAll(".j-del").forEach(function(b){
    b.addEventListener("click", async function(){
      if(!window.confirm("Delete this planned job?")) return;
      try{ await deleteRecord(b.getAttribute("data-id")); notify("Job deleted.", false); await viewJobs(filter, showDone); }
      catch(e){ notify("Couldn't delete: " + (e && e.message ? e.message : e), true); }
    });
  });
}

  html += '<div class="med-grid" style="grid-template-columns:1fr 1fr"><div class="field"><label for="pj_date">Date</label><input id="pj_date" type="date" value="'+ymdLocal(new Date())+'"></div>'
    + '<div class="field"><label for="pj_time">Time (optional)</label><input id="pj_time" type="time"></div></div>';
  html += '<div id="pj_medbox"><div class="field"><label for="pj_drug">Medication</label><select id="pj_drug"><option value="">—</option>'
    + meds.map(function(m){ return '<option value="'+esc(m.name)+'">'+esc(m.name)+'</option>'; }).join("") + '<option value="Other">Other</option></select></div>'
    + '<div class="field"><label for="pj_dose" id="pj_doselabel">Dose</label><input id="pj_dose" type="number" inputmode="decimal" min="0" step="any"></div></div>';
  html += '<div class="med-grid" style="grid-template-columns:1fr 1fr"><div class="field"><label for="pj_count">How many times</label><input id="pj_count" type="number" inputmode="numeric" min="1" max="60" step="1" value="1"></div>'
    + '<div class="field"><label for="pj_every">Repeat every</label><select id="pj_every">'
    + '<option value="12">12 hours (twice a day)</option><option value="24" selected>24 hours (daily)</option><option value="48">2 days</option><option value="72">3 days</option><option value="168">7 days (weekly)</option>'
    + '</select></div></div>';
  html += '<div class="hint" id="pj_hint"></div>';
  html += '<div class="field"><label for="pj_notes">Notes</label><textarea id="pj_notes" placeholder="e.g. which male, which recipient, instructions"></textarea></div>';
  html += '<div class="row-actions"><button class="primary" id="pj_save">Save job</button></div></div>';
  app.innerHTML = html;
  var el = function(id){ return document.getElementById(id); };
  function refresh(){
    var isMed = el("pj_type").value === "medication";
    el("pj_medbox").style.display = isMed ? "" : "none";
    var m = findMed(meds, el("pj_drug").value);
    el("pj_doselabel").textContent = "Dose" + (m && m.unit ? " (" + m.unit + ")" : "");
    var n = parseInt(el("pj_count").value, 10) || 1;
    var txt = "";
    if(n > 1){
      var start = new Date(el("pj_date").value + "T" + (el("pj_time").value || "00:00"));
      var last = new Date(start.getTime() + (n-1) * parseInt(el("pj_every").value,10) * 3600000);
      txt = n + " jobs will be planned, the last one on " + last.toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"}) + (el("pj_time").value ? " at " + hmLocal(last) : "") + ".";
    }
    if(isMed && m){ var up = medUnitPrice(m); var dose = parseFloat(el("pj_dose").value);
      if(up !== null && dose > 0) txt += (txt ? " " : "") + "Each dose costs about " + money(dose*up) + (n > 1 ? " (" + money(dose*up*n) + " in total)" : "") + "."; }
    el("pj_hint").textContent = txt;
  }
  ["pj_type","pj_drug","pj_dose","pj_count","pj_every","pj_date","pj_time"].forEach(function(id){ el(id).addEventListener("input", refresh); el(id).addEventListener("change", refresh); });
  refresh();
  el("pj_save").addEventListener("click", async function(){
    var camelTag = el("pj_camel").value, type = el("pj_type").value, date = el("pj_date").value, time = el("pj_time").value;
    var n = Math.max(1, Math.min(60, parseInt(el("pj_count").value, 10) || 1));
    var every = parseInt(el("pj_every").value, 10);
    if(!camelTag){ notify("Choose the camel.", true); return; }
    if(!date){ notify("Choose the date.", true); return; }
    if(n > 1 && every < 24 && !time){ notify("Enter a time when repeating every 12 hours.", true); return; }
    var t = jobType(type);
    var drug = type === "medication" ? el("pj_drug").value : "";
    var dose = type === "medication" ? el("pj_dose").value.trim() : "";
    var m = findMed(meds, drug);
    var base = new Date(date + "T" + (time || "00:00"));
    var btn = this; btn.disabled = true;
    try{
      for(var i = 0; i < n; i++){
        btn.textContent = "Saving " + (i+1) + " / " + n + "…";
        var d = new Date(base.getTime() + i * every * 3600000);
        var data = {jobType: type, jobTypeLabel: t.label, date: ymdLocal(d), time: time ? hmLocal(d) : "",
          drug: drug, dose: dose, doseUnit: (m && dose) ? m.unit : "", notes: el("pj_notes").value.trim(),
          seriesIndex: i+1, seriesCount: n};
        await addRecord(camelTag, "task", data, {dueDate: d.toISOString(), dueLabel: t.label + (drug ? ": " + drug : "")});
      }
      notify(n === 1 ? "Job planned." : n + " jobs planned.", false);
      go("#/jobs");
    }catch(e){
      btn.disabled = false; btn.textContent = "Save job";
      notify("Couldn't save: " + (e && e.message ? e.message : e), true);
    }
  });
}

// ---------- router ----------
async function render(){
  if(pinShown) return;
  var hash = window.location.hash.replace(/^#/,"") || "/";
  if(hash.charAt(0) !== "/"){ window.location.replace("#/k/" + encodeURIComponent(decodeURIComponent(hash))); return; }
  var qs = "", qi = hash.indexOf("?");
  if(qi >= 0){ qs = hash.slice(qi+1); hash = hash.slice(0, qi); }
  hashQuery = new URLSearchParams(qs);
  var parts = hash.split("/").filter(Boolean);
  try{
    if(parts.length === 0){
      await viewHome();
    } else if(parts[0] === "embryo"){
      await viewEmbryoDashboard(parts[1] || "all");
    } else if(parts[0] === "meds"){
      await viewMeds();
    } else if(parts[0] === "jobs" && parts[1] === "new"){
      await viewPlanJob(hashQuery.get("camel") || null);
    } else if(parts[0] === "jobs"){
      await viewJobs(parts[1] || "all", hashQuery.get("done") === "1");
    } else if(parts[0] === "reminders"){
      await viewJobs("all", false);
    } else if(parts[0] === "k" && parts[1]){
      var rawTag = decodeURIComponent(parts[1]);
      var tag = cleanTag(rawTag);
      if(!tag){ await viewHome(); return; }
      if(tag !== rawTag){ parts[1] = encodeURIComponent(tag); window.location.replace("#/" + parts.join("/") + (qs ? "?" + qs : "")); return; }
      if(parts[2] !== "new"){
        var canon = await api("resolveTag", {tag: tag});
        if(canon && canon !== tag){ parts[1] = encodeURIComponent(canon); window.location.replace("#/" + parts.join("/") + (qs ? "?" + qs : "")); return; }
      }
      if(parts[2] === "new") await viewNewCamel(tag);
      else if(parts[2] === "edit") await viewCamelEdit(tag);
      else if(parts[2] === "history") await viewCamelHistory(tag, parts[3] || null);
      else if(parts[2] === "photo") await viewPhotoForm(tag);
      else if(parts[2] === "plan") await viewPlanJob(tag);
      else if(parts[2] === "f" && parts[3]) await viewRecordForm(tag, parts[3]);
      else if(parts[2] === "r" && parts[3]) await viewEditRecord(tag, decodeURIComponent(parts[3]));
      else await viewCamelDashboard(tag);
    } else {
      await viewHome();
    }
  }catch(e){
    if(pinShown || (e && e.message === "PIN required")) return;
    app.innerHTML = '<div class="flash">Something went wrong: '+esc(e && e.message ? e.message : String(e))+'</div><p><a href="#/">← Back to home</a></p>';
  }
}

window.addEventListener("hashchange", render);

(async function boot(){
  await initCaps();
  try{ await api("ping"); }catch(e){ if(pinShown) return; }
  setWho();
  render();
})();

})();
</script>
